<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Dias Acumulados</title>
    <style>
        /* Importando uma fonte moderna */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --purple: #8b5cf6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 20px;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            align-items: center; /* Centraliza tudo na tela */
        }

        /* --- Área de Controles --- */
        .controls {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            margin-bottom: 24px;
            display: flex;
            gap: 16px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
            max-width: 850px; /* Mesma largura da tabela para alinhar */
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
            font-size: 14px;
        }

        .controls input {
            padding: 10px 14px;
            font-size: 16px;
            width: 90px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
            text-align: center;
            font-weight: 600;
        }

        .controls input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .buttons-container {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .controls button {
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            color: white;
            font-family: inherit;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .controls button:active { transform: translateY(1px); }

        /* Cores dos Botões */
        #addDaysBtn { background-color: var(--success); }
        #addDaysBtn:hover { background-color: #059669; }

        #removeDaysBtn { background-color: var(--warning); }
        #removeDaysBtn:hover { background-color: #d97706; }

        #generateBtn { background-color: var(--text-main); }
        #generateBtn:hover { background-color: #0f172a; }

        #undoBtn { background-color: var(--text-muted); }
        #undoBtn:hover { background-color: #475569; }
        #undoBtn:disabled { background-color: #cbd5e1; cursor: not-allowed; transform: none; }

        #selectAllBtn { background-color: var(--purple); }
        #selectAllBtn:hover { background-color: #7c3aed; }

        #clearBtn { background-color: var(--danger); }
        #clearBtn:hover { background-color: #dc2626; }

        #printBtn { background-color: var(--primary); }
        #printBtn:hover { background-color: #2563eb; }

        /* --- Estrutura da Tabela --- */
        .table-wrapper {
            display: flex;
            flex-direction: column; /* Muda de linha para coluna */
            align-items: center;    /* Centraliza os itens */
            gap: 20px;
            width: 100%;
        }

        .table-container {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            width: 100%;
            max-width: 850px; /* Largura fixa igual ao card */
        }

        table {
            border-collapse: collapse;
            width: 100%;
            table-layout: fixed;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 12px 8px;
            text-align: center;
            width: 10%;
            font-size: 15px;
            font-weight: 500;
        }

        th {
            background-color: #f8fafc;
            color: var(--text-muted);
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-top: none;
            padding: 16px 8px;
        }

        /* Bordas laterais da tabela */
        tr td:first-child { border-left: none; }
        tr td:last-child { border-right: none; }
        tr:last-child td { border-bottom: none; }

        .day-cell {
            cursor: pointer;
            user-select: none;
            color: var(--text-main);
            transition: all 0.15s ease;
        }

        .day-cell:hover { 
            background-color: #f8fafc; 
            color: var(--primary);
        }

        /* Estado Selecionado */
        .day-cell.selected {
            background-color: #eff6ff;
            color: #1d4ed8;
            cursor: not-allowed;
            pointer-events: none;
            font-weight: 700;
        }

        /* Linha de Totais */
        .totals-row td {
            background-color: #f8fafc;
            font-weight: 700;
            color: var(--text-main);
            height: 50px;
            border-bottom: none;
        }

        /* --- Card do Acumulado (Novo Design Horizontal) --- */
        .acumulado-box {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            padding: 20px 30px;
            width: 100%;
            max-width: 850px; /* Largura igual à tabela */
            display: flex;
            flex-direction: row; /* Título e valor lado a lado */
            justify-content: space-between;
            align-items: center;
            border-top: 4px solid var(--primary); /* Linha azul no topo */
        }

        .acumulado-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .acumulado-value {
            font-weight: 800;
            font-size: 32px;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        /* =========================================
           ESTILOS EXCLUSIVOS PARA MOBILE (CELULAR)
           ========================================= */
        @media screen and (max-width: 768px) {
            body { margin: 12px; }

            .controls {
                flex-direction: column;
                padding: 16px;
                gap: 12px;
            }

            .input-group {
                justify-content: space-between;
                width: 100%;
            }

            .controls input { width: 100px; }

            .buttons-container {
                display: grid !important;
                grid-template-columns: 1fr 1fr;
                gap: 8px !important;
                width: 100%;
            }

            .controls button {
                width: 100%;
                padding: 12px 4px;
                font-size: 13px;
            }

            #printBtn { grid-column: span 2; }

            .table-wrapper { gap: 16px; }

            th, td { padding: 10px 2px; font-size: 13px; }
            th { font-size: 11px; }
            .totals-row td { font-size: 12px; }

            /* Card do Acumulado no Mobile */
            .acumulado-box {
                flex-direction: column; /* Empilha no celular para não esmagar */
                justify-content: center;
                text-align: center;
                padding: 20px;
                gap: 8px;
            }

            .acumulado-value {
                font-size: 36px;
                color: var(--primary);
            }
        }

        /* Configurações de Impressão em A4 */
        @media print {
            @page { size: A4 portrait; margin: 1cm; }
            body { background-color: #fff; margin: 0; display: block; }
            .controls { display: none; }
            
            .table-wrapper { gap: 10px; }
            .table-container, .acumulado-box { box-shadow: none; border: 1px solid #ccc; max-width: 100%; }
            .acumulado-box { border-top: 2px solid #000; }
            
            table { page-break-inside: auto; }
            tr { page-break-inside: avoid; page-break-after: auto; }
            th, td { padding: 6px; font-size: 12px; }
            thead { display: table-header-group; }
            tfoot { display: table-footer-group; }
            
            .acumulado-value { font-size: 24px; }
        }
    </style>
</head>
<body>

    <div class="controls">
        <div class="input-group">
            <label for="daysInput">Qtd. Dias:</label>
            <input type="number" id="daysInput" value="50" min="1" max="1000">
        </div>
        
        <div class="buttons-container">
            <button id="addDaysBtn" onclick="handleAddDays()">Incluir Dias</button>
            <button id="removeDaysBtn" onclick="handleRemoveDays()">Remover Dias</button>
            <button id="generateBtn" onclick="handleGenerate()">Reiniciar</button>
            <button id="undoBtn" onclick="handleUndo()" disabled>Desfazer</button>
            <button id="selectAllBtn" onclick="handleSelectAll()">Marcar Todos</button>
            <button id="clearBtn" onclick="handleClear()">Limpar Tudo</button>
            <button id="printBtn" onclick="window.print()">Imprimir / PDF</button>
        </div>
    </div>

    <div class="table-wrapper">
        <div class="table-container">
            <table id="daysTable">
                <thead>
                    <tr>
                        <th colspan="10" style="padding: 16px; font-size: 15px; color: var(--text-main);">DIAS ACUMULADOS</th>
                    </tr>
                </thead>
                <tbody id="daysBody">
                    <!-- Preenchido via JS -->
                </tbody>
                <tfoot>
                    <tr class="totals-row" id="totalsRow">
                        <!-- Preenchido via JS -->
                    </tr>
                </tfoot>
            </table>
        </div>

        <div class="acumulado-box">
            <div class="acumulado-title">Total Acumulado</div>
            <div class="acumulado-value" id="grandTotalDisplay">R$ 0,00</div>
        </div>
    </div>

    <script>
        let totalDays = 50;
        let selectedDays = new Set();
        let colTotals = new Array(10).fill(0);
        let grandTotal = 0;
        
        let undoStack = []; 
        const MAX_UNDO = 50; 

        function formatNumberOnly(value) {
            return value.toLocaleString('pt-BR', { 
                minimumFractionDigits: 0, 
                maximumFractionDigits: 0 
            });
        }

        function formatCurrency(value) {
            return value.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function saveState() {
            const state = {
                days: totalDays,
                selected: Array.from(selectedDays)
            };
            localStorage.setItem('diasAcumuladosState', JSON.stringify(state));
        }

        function loadState() {
            const saved = localStorage.getItem('diasAcumuladosState');
            if (saved) {
                const state = JSON.parse(saved);
                totalDays = state.days;
                const validSelected = state.selected.filter(day => day <= totalDays);
                selectedDays = new Set(validSelected);
                document.getElementById('daysInput').value = totalDays;
            } else {
                totalDays = 50;
                selectedDays = new Set();
                document.getElementById('daysInput').value = 50;
            }
            buildGridDOM();
            renderState();
            updateUndoButton();
        }

        function saveHistory() {
            undoStack.push(Array.from(selectedDays));
            if (undoStack.length > MAX_UNDO) {
                undoStack.shift(); 
            }
            updateUndoButton();
        }

        function updateUndoButton() {
            const undoBtn = document.getElementById('undoBtn');
            undoBtn.disabled = undoStack.length === 0;
        }

        function buildGridDOM() {
            const tbody = document.getElementById('daysBody');
            const totalsRow = document.getElementById('totalsRow');
            tbody.innerHTML = '';
            totalsRow.innerHTML = '';

            let currentDay = 1;
            const numRows = Math.ceil(totalDays / 10);

            for (let r = 0; r < numRows; r++) {
                const tr = document.createElement('tr');
                for (let c = 0; c < 10; c++) {
                    const td = document.createElement('td');
                    if (currentDay <= totalDays) {
                        td.textContent = currentDay;
                        td.classList.add('day-cell');
                        td.dataset.day = currentDay;
                        
                        td.addEventListener('click', function() {
                            handleCellClick(parseInt(this.dataset.day));
                        });
                        
                        currentDay++;
                    } else {
                        td.style.backgroundColor = "#f8fafc";
                        td.style.border = "1px solid #e2e8f0";
                    }
                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
            }

            for (let c = 0; c < 10; c++) {
                const td = document.createElement('td');
                td.id = `col-total-${c}`;
                td.textContent = formatNumberOnly(0);
                totalsRow.appendChild(td);
            }
        }

        function renderState() {
            document.querySelectorAll('.day-cell').forEach(cell => {
                cell.classList.remove('selected');
            });

            selectedDays.forEach(day => {
                const cell = document.querySelector(`.day-cell[data-day="${day}"]`);
                if (cell) cell.classList.add('selected');
            });

            colTotals = new Array(10).fill(0);
            grandTotal = 0;

            selectedDays.forEach(day => {
                const colIndex = (day - 1) % 10;
                colTotals[colIndex] += day;
                grandTotal += day;
            });

            for (let c = 0; c < 10; c++) {
                document.getElementById(`col-total-${c}`).textContent = formatNumberOnly(colTotals[c]);
            }
            document.getElementById('grandTotalDisplay').textContent = formatCurrency(grandTotal);
        }

        function handleCellClick(day) {
            if (selectedDays.has(day)) return;
            saveHistory(); 
            selectedDays.add(day);
            renderState();
            saveState();
        }

        function handleAddDays() {
            const inputVal = parseInt(document.getElementById('daysInput').value);
            
            if (isNaN(inputVal) || inputVal <= 0) {
                alert("Por favor, insira uma quantidade válida maior que zero para incluir.");
                return;
            }

            const newTotal = totalDays + inputVal;
            
            if (newTotal > 1000) {
                alert("O limite máximo de dias no sistema é 1000.");
                return;
            }

            totalDays = newTotal;
            document.getElementById('daysInput').value = totalDays;
            buildGridDOM();
            renderState();
            saveState();
            
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function handleRemoveDays() {
            const inputVal = parseInt(document.getElementById('daysInput').value);
            
            if (isNaN(inputVal) || inputVal <= 0) {
                alert("Por favor, insira uma quantidade válida maior que zero para remover.");
                return;
            }

            const newTotal = totalDays - inputVal;

            if (newTotal < 1) {
                alert("A quantidade total de dias não pode ser menor que 1.");
                return;
            }

            const highestSelected = selectedDays.size > 0 ? Math.max(...selectedDays) : 0;
            
            if (newTotal < highestSelected) {
                alert(`AÇÃO BLOQUEADA!\n\nVocê está tentando reduzir a grade para ${newTotal} dias.\nPorém, o dia ${highestSelected} já está marcado.\n\nPara remover esses dias, você precisa primeiro desmarcar o dia ${highestSelected} (ou usar o botão Desfazer).`);
                return;
            }

            totalDays = newTotal;
            document.getElementById('daysInput').value = totalDays;
            buildGridDOM();
            renderState();
            saveState();
            
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function handleGenerate() {
            const inputVal = parseInt(document.getElementById('daysInput').value);
            if (isNaN(inputVal) || inputVal <= 0 || inputVal > 1000) {
                alert("Por favor, insira um número válido de dias (entre 1 e 1000).");
                return;
            }
            
            if (confirm("Atenção: Isso apagará todos os dias marcados e reiniciará o sistema com o valor digitado. Deseja continuar?")) {
                totalDays = inputVal;
                document.getElementById('daysInput').value = totalDays;
                undoStack = [];
                updateUndoButton();
                selectedDays.clear();
                buildGridDOM();
                renderState();
                saveState();
            }
        }

        function handleSelectAll() {
            if (selectedDays.size === totalDays) return; 
            saveHistory(); 
            for (let i = 1; i <= totalDays; i++) {
                selectedDays.add(i);
            }
            renderState();
            saveState();
        }

        function handleClear() {
            if (selectedDays.size === 0) return; 
            if (confirm("Tem certeza que deseja limpar todas as seleções?")) {
                saveHistory(); 
                selectedDays.clear();
                renderState();
                saveState();
            }
        }

        function handleUndo() {
            if (undoStack.length > 0) {
                const previousState = undoStack.pop();
                selectedDays = new Set(previousState);
                renderState();
                saveState();
                updateUndoButton();
            }
        }

        window.onload = () => {
            loadState();
        };
    </script>
</body>
</html>
